<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SamDU API hujjatlari</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='images/samdulogo.png') }}" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; background: #f8fafc; font-family: Inter, system-ui, sans-serif; }
    .topbar-samdu { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #0b2a5b; color: #fff; }
    .topbar-samdu img { width: 40px; height: 40px; border-radius: 50%; background: #fff; padding: 2px; }
    .topbar-samdu b { font-size: 17px; } .topbar-samdu span { display: block; font-size: 12px; color: #bfd3fe; }
    .topbar-samdu a { margin-left: auto; color: #e6c25a; font-size: 14px; text-decoration: none; }
    .swagger-ui .topbar { display: none; }
  </style>
</head>
<body>
  <div class="topbar-samdu">
    <img src="{{ url_for('static', filename='images/samdulogo.png') }}" alt="SamDU" />
    <div><b>SamDU AI Yordamchi API</b><span>REST API · v1 · veb va mobil ilovalar uchun</span></div>
    <a href="/api/openapi.json" target="_blank">openapi.json ↗</a>
  </div>
  <div id="swagger"></div>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    SwaggerUIBundle({ url: "/api/openapi.json", dom_id: "#swagger", deepLinking: true, tryItOutEnabled: true, defaultModelsExpandDepth: 0 });
  </script>
</body>
</html>
